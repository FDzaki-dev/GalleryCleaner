name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Decode permanent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          }

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/gallerycleaner-release.jks"

          test -s "$RUNNER_TEMP/gallerycleaner-release.jks"

          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/gallerycleaner-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_PASSWORD" || {
            echo "::error::RELEASE_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$RELEASE_KEY_ALIAS" || {
            echo "::error::RELEASE_KEY_ALIAS is missing."
            exit 1
          }

          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "::error::RELEASE_KEY_PASSWORD is missing."
            exit 1
          }

          SHORT_SHA="$(git rev-parse --short HEAD)"
          LOG_FILE="log-fail_${GITHUB_REF_NAME}_run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}_${SHORT_SHA}.log"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"

          set +e
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$LOG_FILE"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$BUILD_STATUS"

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOG_FILE }}
          path: ${{ env.LOG_FILE }}
          if-no-files-found: warn

      - name: Verify APK exists and is signed
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK size:"
          du -h "$APK"

          echo "Verifying APK signature..."
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"

      - name: Rename APK
        run: |
          set -euo pipefail

          # VERSION_NAME used to be "1.0.$(git rev-list --count HEAD)" — a
          # DIFFERENT counter than the release tag/name just below
          # ("v1.0.${{ github.run_number }}"). Total commit count and CI
          # run number drift apart over time (re-runs, workflow_dispatch,
          # multiple commits batched into one push all bump run_number
          # without matching 1:1 to commit count), which is exactly why the
          # APK was showing v1.0.44 while the GitHub Release right next to
          # it already said v1.0.165 — not a forgotten manual bump, two
          # independent auto-generated numbers that were never the same
          # thing. Now both use $GITHUB_RUN_NUMBER, so the APK filename and
          # the release tag/name always match, by construction, permanently.
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          # No "-Release" suffix — matches the plain "{App}-v{version}.apk"
          # convention (e.g. PromptVault-v7.2.0.apk), and the run number
          # already embedded in VERSION_NAME is what makes each build's
          # filename unique, the same job "-Release" used to do.
          OUT_NAME="GalleryCleaner-v${VERSION_NAME}.apk"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/$OUT_NAME"

          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: app/build/outputs/apk/release/${{ env.OUT_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_name == 'main' || github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GalleryCleaner v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/${{ env.OUT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
