name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore when configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured. The build will use the runner's debug signing key for testing only."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Locate and verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "Verifying APK signature..."
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK verification passed."

      - name: Rename APK
        run: |
          VERSION_NAME="1.0.$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          OUT_NAME="GalleryCleaner-v${VERSION_NAME}-${SHORT_SHA}.apk"
          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$OUT_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: app/build/outputs/apk/release/${{ env.OUT_NAME }}
          if-no-files-found: error
