name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          echo "::group::sdkmanager output (verbose — safe to skip unless this step fails)"
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "::endgroup::"

      - name: Decode permanent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          }

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/gallerycleaner-release.jks"

          test -s "$RUNNER_TEMP/gallerycleaner-release.jks"

          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/gallerycleaner-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_PASSWORD" || {
            echo "::error::RELEASE_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$RELEASE_KEY_ALIAS" || {
            echo "::error::RELEASE_KEY_ALIAS is missing."
            exit 1
          }

          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "::error::RELEASE_KEY_PASSWORD is missing."
            exit 1
          }

          SHORT_SHA="$(git rev-parse --short HEAD)"
          LOG_FILE="log-fail_${GITHUB_REF_NAME}_run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}_${SHORT_SHA}.log"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"

          set +e
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$LOG_FILE"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$BUILD_STATUS"

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOG_FILE }}
          path: ${{ env.LOG_FILE }}
          if-no-files-found: warn

      - name: Verify APK exists and is signed
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          APK_SIZE="$(du -h "$APK" | cut -f1)"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK size: $APK_SIZE"

          echo "Verifying APK signature..."
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"

      - name: Verify versionCode matches GITHUB_RUN_NUMBER (Versioning Lock)
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"

          BAKED_VERSION_CODE="$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+")"
          BAKED_VERSION_NAME="$(echo "$BADGING" | grep -oP "versionName='\K[^']+")"
          EXPECTED_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          echo "Baked into APK -> versionCode=$BAKED_VERSION_CODE versionName=$BAKED_VERSION_NAME"
          echo "Expected (CI)  -> versionCode=$GITHUB_RUN_NUMBER versionName=$EXPECTED_VERSION_NAME"

          if [ "$BAKED_VERSION_CODE" != "$GITHUB_RUN_NUMBER" ] || [ "$BAKED_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]; then
            echo "::error::Versioning Lock violated — APK's baked-in versionCode/versionName does not match GITHUB_RUN_NUMBER. This is the exact drift (Batch83, AUDIT_GAP.md #15) that once made the APK disagree with its own filename/GitHub Release tag. Check app/build.gradle.kts's versionCode source."
            exit 1
          fi

          echo "Versioning Lock OK — APK versionCode/versionName match GITHUB_RUN_NUMBER."

      - name: Rename APK
        run: |
          set -euo pipefail

          # VERSION_NAME used to be "1.0.$(git rev-list --count HEAD)" — a
          # DIFFERENT counter than the release tag/name just below
          # ("v1.0.${{ github.run_number }}"). Total commit count and CI
          # run number drift apart over time (re-runs, workflow_dispatch,
          # multiple commits batched into one push all bump run_number
          # without matching 1:1 to commit count), which is exactly why the
          # APK was showing v1.0.44 while the GitHub Release right next to
          # it already said v1.0.165 — not a forgotten manual bump, two
          # independent auto-generated numbers that were never the same
          # thing. Now both use $GITHUB_RUN_NUMBER, so the APK filename and
          # the release tag/name always match, by construction, permanently.
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          # No "-Release" suffix — matches the plain "{App}-v{version}.apk"
          # convention (e.g. PromptVault-v7.2.0.apk), and the run number
          # already embedded in VERSION_NAME is what makes each build's
          # filename unique, the same job "-Release" used to do.
          OUT_NAME="GalleryCleaner-v${VERSION_NAME}.apk"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/$OUT_NAME"

          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: app/build/outputs/apk/release/${{ env.OUT_NAME }}
          if-no-files-found: error

      # Section 4 ("GitHub Workflow — Anti-Desync") requires this: if
      # another push landed on main while THIS run was still building (JDK
      # setup + SDK download + Gradle assembleRelease above can take
      # several minutes), origin/main's tip will have moved past the
      # commit that triggered this run. Publishing anyway would make an
      # OLDER commit's APK the "latest" GitHub Release, silently regressing
      # the version users see — the exact desync this guard exists to stop.
      # Placed here (immediately before the publish step, not earlier) on
      # purpose: checking right after checkout would only catch a push that
      # already existed at trigger time, not one that lands *during* this
      # run's own build — the race window this guard actually needs to
      # close is between trigger and publish, so the check has to happen as
      # close to publish as possible. Re-fetches origin/main fresh here
      # rather than trusting the initial checkout's snapshot, since that
      # snapshot is from job start and may itself now be behind. Scoped to
      # `main` only (matches the instruction's literal wording, "tip 'main'
      # lokal") — the `master` push trigger below is a separate legacy
      # fallback this guard doesn't reason about.
      - name: Stale Run Guard (Anti-Desync)
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail

          git fetch origin main
          LATEST_MAIN="$(git rev-parse origin/main)"

          if [ "$GITHUB_SHA" != "$LATEST_MAIN" ]; then
            echo "::error::Stale run — this run was triggered by commit $GITHUB_SHA, but origin/main has since moved to $LATEST_MAIN. A newer push exists; aborting so this run doesn't publish an outdated release."
            exit 1
          fi

          echo "Up to date with origin/main ($LATEST_MAIN) — safe to publish."

      # Batch76 — generate_release_notes: true groups changes by merged PR;
      # this repo pushes straight to `main` from the Termux scripts (no PR,
      # ever), so it had nothing to list — every release's body reduced to
      # just a header + "Full Changelog" line, both of which
      # UpdateChecker.kt's shortSummary filter (by design) strips, leaving
      # 0 bullets → the same generic "New release available." fallback on
      # every single update, not just one. Fix: build the body ourselves
      # from real commit messages since the previous tag (the person
      # already writes a meaningful one per push via the Daily Update
      # script's [Deskripsi Perubahan]) — in the exact `## What's Changed`
      # / `- <line>` / `**Full Changelog**: <url>` shape UpdateChecker.kt
      # already expects, so 0 changes needed to that filtering logic.
      - name: Generate changelog from commits
        run: |
          set -euo pipefail

          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          NEW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"

          # -n 30 (not a `| head` pipe) on purpose: piping git log into
          # head can SIGPIPE the writer once head's limit is hit, which
          # `pipefail` above would then treat as a step failure.
          if [ -n "$PREV_TAG" ]; then
            BULLETS="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s')"
          else
            BULLETS="$(git log --no-merges --pretty=format:'- %s' -n 30)"
          fi
          if [ -z "$BULLETS" ]; then
            BULLETS="- No commit messages found for this build."
          fi

          {
            echo "## What's Changed"
            echo "$BULLETS"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${NEW_TAG}"
            fi
          } > "$NOTES_FILE"

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        id: release
        if: github.ref_name == 'main' || github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GalleryCleaner v1.0.${{ github.run_number }}
          body_path: ${{ env.NOTES_FILE }}
          files: app/build/outputs/apk/release/${{ env.OUT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Batch63: everything above this line reports its own result the
      # usual GitHub Actions way (raw step logs + red ❌/green ✅ per step).
      # This step doesn't replace that — it's `if: always()` purely to add
      # a single at-a-glance Markdown card at the top of the run page
      # ($GITHUB_STEP_SUMMARY), so "did this build succeed, what's the
      # version, where's the APK/release" doesn't require scrolling raw
      # logs to answer. Deliberately no `set -euo pipefail`: a hiccup in
      # this purely-cosmetic step (e.g. `git rev-parse` failing for some
      # unrelated reason) must never fail an otherwise-successful build.
      - name: Job summary
        if: always()
        run: |
          {
            echo "## 📦 GalleryCleaner — run #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| Commit | \`$(git rev-parse --short HEAD 2>/dev/null || echo unknown)\` on \`${GITHUB_REF_NAME}\` |"
            if [ -n "${OUT_NAME:-}" ]; then
              echo "| APK | \`${OUT_NAME}\` (${APK_SIZE:-size unknown}) |"
            fi
            if [ -n "${{ steps.release.outputs.url }}" ]; then
              echo "| Release | ${{ steps.release.outputs.url }} |"
            fi
            if [ "${{ job.status }}" != "success" ] && [ -n "${LOG_FILE:-}" ]; then
              echo "| Build log | \`${LOG_FILE}\` — see the uploaded artifact above ⬆️ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
